# hot reload config
unbind r 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
# Change prefix from 'Ctrl+b' to 'Ctrl+a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# turn on mouse support
set -g mouse on
set -g default-terminal "tmux-256color"
# set status interval for the bar to update
set -g status-interval 1
# set window indexing from 1
set -g base-index 1
# Change pane numbers to start with 1 instead of 0
set -g pane-base-index 1
# renumber windows when theyre closed
set -g renumber-windows

bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R 

set-option -g status-position top

# Plugin list

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
# Let the terminal background show through instead of painting a solid status bar.
set -g @catppuccin_status_background "none"
# The stock rounded style reverses transparent backgrounds, which creates a
# pale separator. These use the existing theme colors without that reversal.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_overlay_2},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg=default]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_mauve},bg=default]"
set -g window-status-separator " "   # ADDED: Explicit 1-space distance between window tabs

# Match the compact modules in the reference without changing their colors.
# Enable floating pill separation and spacing
set -g @catppuccin_status_left_separator  " "   # Space BEFORE  adds leading transparent gap
set -g @catppuccin_status_right_separator " "   # Space AFTER  adds trailing transparent gap
set -g @catppuccin_status_connect_separator "no"  # CRITICAL: resets bg to default between modules
set -g @catppuccin_session_text " #S"
set -g @catppuccin_directory_text ' #(p="#{pane_current_path}"; if [ "${p#"$HOME"}" != "$p" ]; then p="~${p#"$HOME"}"; fi; if [ "${#p}" -gt 40 ]; then a=${p%${p#???????????????????}}; b=${p#${p%??????????????????}}; p="$a...$b"; fi; echo -n "$p")'
set -g @catppuccin_date_time_text " %H:%M"

# remove hostname from the window bar
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_pane_number_position "right"
set -g @catppuccin_window_number_position "right"

# The Neovim `smart-splits-backend-tmux` dependency sets the pane-local
# `@pane-is-vim` flag used by the bindings below.  The core Neovim plugin is
# no longer a tmux plugin in smart-splits v3, so do not load it through tpack.
set -g @plugin "catppuccin/tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Disable underline on active window name
set -g @catppuccin_window_current_text "#[nounderscore]#W"
set -g @catppuccin_window_text "#[nounderscore]#W"
# Init TMUX plugin manager
run 'tpack init'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
# Keep the session on the left, with windows in the middle—the layout in the reference.
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
