# hot reload config
unbind r 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
# Change prefix from 'Ctrl+b' to 'Ctrl+a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# turn on mouse support
set -g mouse on
set -g default-terminal "tmux-256color"
# set status interval for the bar to update
set -g status-interval 1
# set window indexing from 1
set -g base-index 1
# Change pane numbers to start with 1 instead of 0
set -g pane-base-index 1
# renumber windows when theyre closed
set -g renumber-windows

bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R 

set-option -g status-position top

# Plugin list

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"


# set the directory module to display full path
set -g @catppuccin_directory_text " #{pane_current_path}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"

# remove hostname from the window bar
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_pane_number_position "right"
set -g @catppuccin_window_number_position "right"

# load vim-tmux-navigator plugin
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin "catppuccin/tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Init TMUX plugin manager
run 'tpack init'
