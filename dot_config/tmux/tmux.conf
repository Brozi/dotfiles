# hot reload config
unbind r 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
# Change prefix from 'Ctrl+b' to 'Ctrl+a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# turn on mouse support
set -g mouse on
set -g default-terminal "tmux-256color"
# set status interval for the bar to update
set -g status-interval 1
# set window indexing from 1
set -g base-index 1
# Change pane numbers to start with 1 instead of 0
set -g pane-base-index 1
# renumber windows when theyre closed
set -g renumber-windows

bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R 

set-option -g status-position top

# Plugin list

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"


# set the directory module to display full path
set -g @catppuccin_directory_text " #{pane_current_path}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# remove hostname from the window bar
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_pane_number_position "right"
set -g @catppuccin_window_number_position "right"

# load vim-tmux-navigator plugin
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin "catppuccin/tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'A-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'A-j' #  --"--
set -g @smart-splits_resize_up_key    'A-k' #  --"--
set -g @smart-splits_resize_right_key 'A-l' #  --"--

set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# Init TMUX plugin manager
run 'tpack init'
