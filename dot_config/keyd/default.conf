[ids]
*

[main]
capslock = escape

[control+shift]
capslock = capslock

[figma_shift:S]
rightalt = swap(polish_altgr_shift)

[polish_altgr]
leftshift = layer(polish_altgr_shift)
rightshift = layer(polish_altgr_shift)

a = macro(15ms compose 10ms , 10ms a)
c = macro(15ms compose 10ms ' 10ms c)
e = macro(15ms compose 10ms , 10ms e)
l = macro(15ms compose 10ms / 10ms l)
n = macro(15ms compose 10ms ' 10ms n)
o = macro(15ms compose 10ms ' 10ms o)
s = macro(15ms compose 10ms ' 10ms s)
x = macro(15ms compose 10ms ' 10ms z)
z = macro(15ms compose 10ms . 10ms z)

[polish_altgr_shift]
a = macro(15ms compose 10ms , 10ms S-a)
c = macro(15ms compose 10ms ' 10ms S-c)
e = macro(15ms compose 10ms , 10ms S-e)
l = macro(15ms compose 10ms / 10ms S-l)
n = macro(15ms compose 10ms ' 10ms S-n)
o = macro(15ms compose 10ms ' 10ms S-o)
s = macro(15ms compose 10ms ' 10ms S-s)
x = macro(15ms compose 10ms ' 10ms S-z)
z = macro(15ms compose 10ms . 10ms S-z)
