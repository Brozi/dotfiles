#:schema https://yazi-rs.github.io/schemas/yazi.json
[mgr]
mouse_events = [ "click", "scroll", "touch", "move", "drag" ]
sort_by = "mtime"
sort_sensitive = false
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
